.album-date{margin:0 42px 18px;color:var(--orange);font-size:1.18rem;font-weight:600}

const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const formatDate=s=>{const [y,m,d]=s.split('-').map(Number);return d+' de '+monthNames[m-1][0].toUpperCase()+monthNames[m-1].slice(1)+' de '+y};
function publicPhoto(path){return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
async function loadMonth(){
 const first=new Date(state.month.getFullYear(),state.month.getMonth(),1),offset=(first.getDay()+6)%7,last=new Date(state.month.getFullYear(),state.month.getMonth()+1,0);
 const visibleStart=new Date(first);visibleStart.setDate(first.getDate()-offset);
 const visibleEnd=new Date(last);visibleEnd.setDate(last.getDate()+(6-((last.getDay()+6)%7)));
 const start=dateKey(visibleStart),end=dateKey(visibleEnd);
 const monthKey=state.month.getFullYear()+'-'+String(state.month.getMonth()+1).padStart(2,'0');
 $('monthTitle').textContent='❧ '+monthNames[state.month.getMonth()].toUpperCase()+' '+state.month.getFullYear()+' ❧';
 $('monthSubtitle').textContent=monthSubtitles[monthKey]||'';
 const song=monthSongs[monthKey];
 $('monthlySong').src=song?'https://open.spotify.com/embed/track/'+song.id+'?utm_source=generator':'';
 $('monthlySong').title=song?song.title:'Canción del mes';
 $('monthlySong').hidden=!song;
 $('loading').hidden=false;
 const {data:albums,error}=await db.from('calendar_albums').select('id,album_date,title,is_flower_gift,calendar_photos(id,storage_path,alt_text,sort_order)').gte('album_date',start).lte('album_date',end).order('album_date');
 if(error){$('loading').textContent='No se pudieron cargar los recuerdos. '+error.message;return}
 state.albums=albums||[];state.photos=state.albums.flatMap(a=>(a.calendar_photos||[]).map(p=>({...p,album_date:a.album_date,is_flower_gift:a.is_flower_gift})));
 renderCalendar();$('loading').hidden=true;
}
function openUploadModal(key=''){
 const selectedDate=key||dateKey(new Date());
 $('albumDate').value=selectedDate;
 {const [y,m,d]=selectedDate.split('-').map(Number);$('uploadDateDisplay').textContent=d+' de '+monthNames[m-1][0].toUpperCase()+monthNames[m-1].slice(1);}
 $('photos').value='';
 $('flowerGift').checked=false;
 $('adminStatus').textContent='';
 $('uploadModal').classList.add('open');
 document.body.style.overflow='hidden';
 $('uploadClose').focus();
}
function closeUploadModal(){
 $('uploadModal').classList.remove('open');
 document.body.style.overflow=$('modal').classList.contains('open')?'hidden':'';
}
function startUploadForDate(key){openUploadModal(key)}
function createCakeSymbol(){
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('class','cake-symbol');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');
 const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M4 10h16v9H4z M3.5 10c0-2 2.2-3.1 4.1-1.6 1.1-2.1 3.8-2.3 4.8-.1 1.2-2.1 3.9-2 4.9.1 1.9-1.4 4.1-.3 4.1 1.6');
 const candles=document.createElementNS('http://www.w3.org/2000/svg','path');candles.setAttribute('d','M8 7V4 M12 7V3 M16 7V4');
 svg.append(path,candles);return svg;
}
function renderCalendar(){
 const grid=$('calendar');grid.innerHTML='';
 const first=new Date(state.month.getFullYear(),state.month.getMonth(),1),offset=(first.getDay()+6)%7,last=new Date(state.month.getFullYear(),state.month.getMonth()+1,0);
 const start=new Date(first);start.setDate(first.getDate()-offset);
 const end=new Date(last);end.setDate(last.getDate()+(6-((last.getDay()+6)%7)));
 for(let cursor=new Date(start);cursor<=end;){
  const week=document.createElement('div');week.className='week-row';
  for(let i=0;i<7;i++){
   const date=new Date(cursor),key=dateKey(date),day=date.getDate(),album=state.albums.find(a=>a.album_date===key),photos=(album?.calendar_photos||[]).sort((a,b)=>a.sort_order-b.sort_order);
   const cell=document.createElement('div');cell.className='day';
   const birthdayLabel=date.getMonth()===7&&day===11?'I':date.getMonth()===9&&day===21?'B':'';
   if(day===2)cell.classList.add('special-day');
   if(birthdayLabel)cell.classList.add('birthday-day');
   if(date.getMonth()!==state.month.getMonth())cell.classList.add('outside-month');
   if(photos.length){
    const b=document.createElement('button');b.className='day-photo';b.setAttribute('aria-label','Abrir álbum del '+formatDate(key));const img=document.createElement('img');img.src=publicPhoto(photos[0].storage_path);img.alt=photos[0].alt_text||'Recuerdo del '+formatDate(key);b.append(img);b.addEventListener('click',()=>openAlbum(album));cell.append(b);
    const n=document.createElement('button');n.type='button';n.className='day-number';
    if(birthdayLabel){n.classList.add('birthday-number');const prefix=document.createElement('span');prefix.className='birthday-prefix';prefix.textContent=birthdayLabel;n.append(prefix);n.append(createCakeSymbol());}
    else n.textContent=day===2?'♥':day;
    n.setAttribute('aria-label','Añadir fotografías al '+formatDate(key));n.addEventListener('click',()=>startUploadForDate(key));cell.append(n);
   }else{
    cell.classList.add('empty-selectable');cell.setAttribute('role','button');cell.setAttribute('tabindex','0');cell.setAttribute('aria-label','Añadir fotografías al '+formatDate(key));
    const placeholder=document.createElement('div');placeholder.className='day-photo day-photo-placeholder';placeholder.setAttribute('aria-hidden','true');cell.append(placeholder);
    const n=document.createElement('span');n.className='day-number-only';
    if(birthdayLabel){n.classList.add('birthday-number');const prefix=document.createElement('span');prefix.className='birthday-prefix';prefix.textContent=birthdayLabel;n.append(prefix);n.append(createCakeSymbol());}
    else n.textContent=day===2?'♥':day;
    cell.append(n);
    cell.addEventListener('click',()=>startUploadForDate(key));
    cell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startUploadForDate(key)}});
   }
   week.append(cell);cursor.setDate(cursor.getDate()+1);
  }
  grid.append(week);
 }
}
function updateTogetherCounter(){
 const start=new Date(2026,9,2);start.setHours(0,0,0,0);
 const today=new Date();today.setHours(0,0,0,0);
 const days=Math.max(0,Math.floor((today-start)/86400000));
 $('togetherCount').textContent='Llevamos '+days+' días juntos';
}

function openAlbum(album){state.activePhotos=[...(album.calendar_photos||[])].sort((a,b)=>a.sort_order-b.sort_order);state.activeIndex=0;state.activeAlbumDate=album.album_date;state.previousFocus=document.activeElement;const [y,m,d]=album.album_date.split('-');$('albumDateTitle').textContent=Number(d)+' de '+monthNames[Number(m)-1][0].toUpperCase()+monthNames[Number(m)-1].slice(1);$('modal').classList.add('open');document.body.style.overflow='hidden';showPhoto();preloadPhoto(1);$('close').focus()}
const photoPreloadCache=new Map();
function preloadPhoto(index){if(index<0||index>=state.activePhotos.length)return;const url=publicPhoto(state.activePhotos[index].storage_path);if(photoPreloadCache.has(url))return;const image=new Image();image.decoding='async';image.src=url;photoPreloadCache.set(url,image);if(image.decode)image.decode().catch(()=>{})}
function showPhoto(){const p=state.activePhotos[state.activeIndex];if(!p)return;const image=$('albumImage');image.decoding='async';image.loading='eager';image.src=publicPhoto(p.storage_path);image.alt=p.alt_text||'Fotografía '+(state.activeIndex+1);const count=$('photoCount');if(Number(count.dataset.count)!==state.activePhotos.length){count.dataset.count=state.activePhotos.length;count.innerHTML='<div class="photo-progress">'+state.activePhotos.map(()=>'<span class="photo-dot" aria-hidden="true"></span>').join('')+'<span class="photo-heart" aria-hidden="true">♥</span></div>';}const progress=count.firstElementChild;progress.style.setProperty('--index',state.activeIndex);count.setAttribute('aria-label','Fotografía '+(state.activeIndex+1)+' de '+state.activePhotos.length);$('back').disabled=state.activePhotos.length<2;$('forward').disabled=state.activePhotos.length<2;preloadPhoto(state.activeIndex+1);preloadPhoto(state.activeIndex-1)}
function closeAlbum(){$('modal').classList.remove('open');document.body.style.overflow='';if(state.previousFocus)state.previousFocus.focus()}
function movePhoto(delta){state.activeIndex=(state.activeIndex+delta+state.activePhotos.length)%state.activePhotos.length;showPhoto()}
$('prev').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);loadMonth()};
$('next').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);loadMonth()};
$('close').onclick=closeAlbum;$('back').onclick=()=>movePhoto(-1);$('forward').onclick=()=>movePhoto(1);$('addAlbumPhotos').onclick=()=>openUploadModal(state.activeAlbumDate);
let swipeStartX=null,swipeStartY=null;
$('photoViewer').addEventListener('touchstart',e=>{if(e.touches.length!==1)return;swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY},{passive:true});
$('photoViewer').addEventListener('touchend',e=>{if(swipeStartX===null||!e.changedTouches.length)return;const touch=e.changedTouches[0],dx=touch.clientX-swipeStartX,dy=touch.clientY-swipeStartY;if(state.activePhotos.length>1){if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25){movePhoto(dx<0?1:-1)}else if(Math.abs(dx)<12&&Math.abs(dy)<12){const imageRect=$('albumImage').getBoundingClientRect();if(touch.clientX>=imageRect.left&&touch.clientX<=imageRect.right&&touch.clientY>=imageRect.top&&touch.clientY<=imageRect.bottom)movePhoto(touch.clientX<imageRect.left+imageRect.width/2?-1:1)}}swipeStartX=null;swipeStartY=null},{passive:true});
$('uploadClose').onclick=closeUploadModal;
$('uploadModal').addEventListener('click',e=>{if(e.target===$('uploadModal'))closeUploadModal()});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeAlbum()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  if($('uploadModal').classList.contains('open'))closeUploadModal();
  else if($('modal').classList.contains('open'))closeAlbum();
  return;
 }
 if(!$('modal').classList.contains('open'))return;
 if(e.key==='ArrowLeft')movePhoto(-1);if(e.key==='ArrowRight')movePhoto(1);
});

$('upload').onclick=async()=>{
 const files=[...$('photos').files],date=$('albumDate').value;if(!date||!files.length){$('adminStatus').textContent='Selecciona una fecha y al menos una fotografía.';return}
 $('upload').disabled=true;$('adminStatus').textContent='Subiendo fotografías…';
 try{
  const {data:album,error:albumError}=await db.from('calendar_albums').upsert({album_date:date,is_flower_gift:$('flowerGift').checked},{onConflict:'album_date'}).select().single();if(albumError)throw albumError;
  const {data:existing}=await db.from('calendar_photos').select('sort_order').eq('album_id',album.id).order('sort_order',{ascending:false}).limit(1);
  let order=(existing?.[0]?.sort_order??-1)+1;
  for(const file of files){const safe=file.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'-');const path=album.id+'/'+Date.now()+'-'+order+'-'+safe;const {error:upError}=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(upError)throw upError;const {error:rowError}=await db.from('calendar_photos').insert({album_id:album.id,storage_path:path,sort_order:order});if(rowError)throw rowError;order++}
  $('adminStatus').textContent='Álbum guardado correctamente.';$('photos').value='';await loadMonth();setTimeout(()=>closeUploadModal(),700);
 }catch(e){$('adminStatus').textContent='No se pudo guardar: '+e.message}finally{$('upload').disabled=false}
};
updateTogetherCounter();
loadMonth();
</script>
